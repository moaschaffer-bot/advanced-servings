<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="766" viewBox="0 0 720 383" role="img" aria-label="Flexible servings cart preview, light theme">
  <title>Flexible servings cart preview (light)</title>
  <desc>Flexible mode cart — staff names servings; bottom row includes a New serving button so they can spawn the next one.</desc>
  <defs>
    <clipPath id="screen-clip-fl-light">
      <rect x="60" y="40" width="600" height="303" rx="16"/>
    </clipPath>
    <style>
      .cart-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="60" y="40" width="600" height="303" rx="16" fill="#E5E8EE" stroke="#C5C7CE" stroke-width="0.6"/>

  <g clip-path="url(#screen-clip-fl-light)">
    <rect x="60" y="40" width="44" height="303" fill="#FFFFFF"/>
    <circle cx="82" cy="66" r="3.5" fill="#C5C7CE"/>
    <rect x="68" y="102" width="28" height="28" rx="8" fill="#EAE6FF"/>
    <circle cx="82" cy="116" r="3.5" fill="#6A5AE0"/>
    <circle cx="82" cy="156" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="188" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="280" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="312" r="3.5" fill="#C5C7CE"/>

    <rect x="320" y="56" width="36" height="8" rx="2" fill="#9194A0"/>

    <rect x="118" y="82" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="124" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="166" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="208" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="250" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="292" width="64" height="36" rx="4" fill="#FFFFFF"/>

    <g fill="#FFFFFF">
      <rect x="192" y="82" width="68" height="44" rx="3"/>
      <rect x="266" y="82" width="68" height="44" rx="3"/>
      <rect x="340" y="82" width="68" height="44" rx="3"/>
      <rect x="414" y="82" width="68" height="44" rx="3"/>
      <rect x="192" y="134" width="68" height="44" rx="3"/>
      <rect x="266" y="134" width="68" height="44" rx="3"/>
      <rect x="340" y="134" width="68" height="44" rx="3"/>
      <rect x="414" y="134" width="68" height="44" rx="3"/>
      <rect x="192" y="186" width="68" height="44" rx="3"/>
      <rect x="266" y="186" width="68" height="44" rx="3"/>
      <rect x="340" y="186" width="68" height="44" rx="3"/>
      <rect x="414" y="186" width="68" height="44" rx="3"/>
      <rect x="192" y="238" width="68" height="44" rx="3"/>
      <rect x="266" y="238" width="68" height="44" rx="3"/>
      <rect x="340" y="238" width="68" height="44" rx="3"/>
      <rect x="414" y="238" width="68" height="44" rx="3"/>
      <rect x="192" y="290" width="68" height="44" rx="3"/>
      <rect x="266" y="290" width="68" height="44" rx="3"/>
      <rect x="340" y="290" width="68" height="44" rx="3"/>
      <rect x="414" y="290" width="68" height="44" rx="3"/>
    </g>

    <!-- Cart panel -->
    <rect x="490" y="40" width="170" height="303" fill="#FFFFFF"/>

    <!-- Tabs -->
    <text class="cart-text" x="504" y="62" font-size="10" font-weight="500" fill="#1a1a2e">Cart</text>
    <text class="cart-text" x="538" y="62" font-size="8" fill="#9194A0">Articles summary</text>
    <line x1="502" y1="68" x2="528" y2="68" stroke="#534AB7" stroke-width="1.4"/>
    <line x1="490" y1="70" x2="660" y2="70" stroke="#E5E7EE" stroke-width="0.5"/>

    <!-- Serving 1 (active) -->
    <circle cx="507" cy="86" r="3" fill="#534AB7"/>
    <text class="cart-text" x="516" y="89" font-size="9.5" font-weight="500" fill="#1a1a2e">Serving 1</text>
    <rect x="632" y="80" width="14" height="12" rx="6" fill="#EAE6FF"/>
    <text class="cart-text" x="639" y="89" font-size="8" font-weight="600" fill="#3C3489" text-anchor="middle">2</text>
    <text class="cart-text" x="504" y="108" font-size="8.5" fill="#3C3D48">1 × Châteauneuf-du-Pape</text>
    <text class="cart-text" x="646" y="108" font-size="8.5" font-weight="500" fill="#1a1a2e" text-anchor="end">165</text>
    <text class="cart-text" x="504" y="124" font-size="8.5" fill="#3C3D48">1 × Brunello di Montalcino</text>
    <text class="cart-text" x="646" y="124" font-size="8.5" font-weight="500" fill="#1a1a2e" text-anchor="end">185</text>

    <line x1="504" y1="138" x2="646" y2="138" stroke="#E5E7EE" stroke-width="0.5"/>

    <!-- Serving 2 -->
    <text class="cart-text" x="516" y="155" font-size="9.5" font-weight="500" fill="#1a1a2e">Serving 2</text>
    <rect x="632" y="146" width="14" height="12" rx="6" fill="#F0F1F5"/>
    <text class="cart-text" x="639" y="155" font-size="8" font-weight="600" fill="#6E707A" text-anchor="middle">2</text>
    <text class="cart-text" x="504" y="174" font-size="8.5" fill="#3C3D48">1 × Dover Sole Meunière</text>
    <text class="cart-text" x="646" y="174" font-size="8.5" font-weight="500" fill="#1a1a2e" text-anchor="end">395</text>
    <text class="cart-text" x="504" y="190" font-size="8.5" fill="#3C3D48">1 × Cacio e Pepe</text>
    <text class="cart-text" x="646" y="190" font-size="8.5" font-weight="500" fill="#1a1a2e" text-anchor="end">195</text>

    <!-- Total -->
    <line x1="502" y1="232" x2="648" y2="232" stroke="#E5E7EE" stroke-width="0.6"/>
    <text class="cart-text" x="646" y="254" font-size="16" font-weight="700" fill="#1a1a2e" text-anchor="end">940,00</text>
    <text class="cart-text" x="646" y="267" font-size="9" font-weight="500" fill="#9194A0" text-anchor="end">SEK</text>

    <!-- Action buttons row: 3 equal-width buttons -->
    <rect x="504" y="289" width="44" height="40" rx="6" fill="#534AB7"/>
    <text class="cart-text" x="526" y="306" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">Fire</text>
    <text class="cart-text" x="526" y="316" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">Serving 1</text>
    <rect x="553" y="289" width="44" height="40" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
    <text class="cart-text" x="575" y="306" font-size="8" font-weight="500" fill="#534AB7" text-anchor="middle">New</text>
    <text class="cart-text" x="575" y="316" font-size="8" font-weight="500" fill="#534AB7" text-anchor="middle">serving</text>
    <rect x="602" y="289" width="44" height="40" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
    <text class="cart-text" x="624" y="313" font-size="9" font-weight="500" fill="#534AB7" text-anchor="middle">Pay</text>
  </g>

  <rect x="492" y="42" width="166" height="299" rx="12" fill="none" stroke="#6A5AE0" stroke-width="1.2" stroke-dasharray="3 2.5"/>
</svg>
