<svg xmlns="http://www.w3.org/2000/svg" width="680" height="383" viewBox="0 0 680 383" role="img" aria-label="Flexible servings cart preview, light theme">
  <title>Flexible servings cart preview (light)</title>
  <desc>Flexible mode cart — staff names servings; bottom row includes a New serving button so they can spawn the next one.</desc>
  <defs>
    <clipPath id="screen-clip-fl-light">
      <rect x="60" y="40" width="560" height="303" rx="16"/>
    </clipPath>
    <style>
      .cart-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="60" y="40" width="560" height="303" rx="16" fill="#E5E8EE" stroke="#C5C7CE" stroke-width="0.6"/>

  <g clip-path="url(#screen-clip-fl-light)">
    <rect x="60" y="40" width="44" height="303" fill="#FFFFFF"/>
    <circle cx="82" cy="66" r="3.5" fill="#C5C7CE"/>
    <rect x="68" y="102" width="28" height="28" rx="8" fill="#EAE6FF"/>
    <circle cx="82" cy="116" r="3.5" fill="#6A5AE0"/>
    <circle cx="82" cy="156" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="188" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="280" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="312" r="3.5" fill="#C5C7CE"/>

    <rect x="320" y="56" width="36" height="8" rx="2" fill="#9194A0"/>

    <rect x="118" y="82" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="124" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="166" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="208" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="250" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="292" width="64" height="36" rx="4" fill="#FFFFFF"/>

    <g fill="#FFFFFF">
      <rect x="192" y="82" width="70" height="44" rx="3"/>
      <rect x="268" y="82" width="70" height="44" rx="3"/>
      <rect x="344" y="82" width="70" height="44" rx="3"/>
      <rect x="420" y="82" width="62" height="44" rx="3"/>
      <rect x="192" y="134" width="70" height="44" rx="3"/>
      <rect x="268" y="134" width="70" height="44" rx="3"/>
      <rect x="344" y="134" width="70" height="44" rx="3"/>
      <rect x="420" y="134" width="62" height="44" rx="3"/>
      <rect x="192" y="186" width="70" height="44" rx="3"/>
      <rect x="268" y="186" width="70" height="44" rx="3"/>
      <rect x="344" y="186" width="70" height="44" rx="3"/>
      <rect x="420" y="186" width="62" height="44" rx="3"/>
      <rect x="192" y="238" width="70" height="44" rx="3"/>
      <rect x="268" y="238" width="70" height="44" rx="3"/>
      <rect x="344" y="238" width="70" height="44" rx="3"/>
      <rect x="420" y="238" width="62" height="44" rx="3"/>
      <rect x="192" y="290" width="70" height="44" rx="3"/>
      <rect x="268" y="290" width="70" height="44" rx="3"/>
      <rect x="344" y="290" width="70" height="44" rx="3"/>
      <rect x="420" y="290" width="62" height="44" rx="3"/>
    </g>

    <!-- Cart panel -->
    <rect x="490" y="40" width="130" height="303" fill="#FFFFFF"/>

    <!-- Tabs -->
    <text class="cart-text" x="502" y="60" font-size="9" font-weight="500" fill="#1a1a2e">Cart</text>
    <text class="cart-text" x="528" y="60" font-size="7.5" fill="#9194A0">Articles</text>
    <line x1="500" y1="66" x2="522" y2="66" stroke="#534AB7" stroke-width="1.2"/>
    <line x1="490" y1="68" x2="620" y2="68" stroke="#E5E7EE" stroke-width="0.5"/>

    <!-- Serving 1 (active) -->
    <circle cx="503" cy="83" r="2.5" fill="#534AB7"/>
    <text class="cart-text" x="510" y="86" font-size="8.5" font-weight="500" fill="#1a1a2e">Serving 1</text>
    <rect x="586" y="78" width="14" height="11" rx="5.5" fill="#EAE6FF"/>
    <text class="cart-text" x="593" y="86" font-size="7" font-weight="600" fill="#3C3489" text-anchor="middle">2</text>
    <text class="cart-text" x="502" y="104" font-size="7.5" fill="#3C3D48">1 × Châteauneuf-du-P.</text>
    <text class="cart-text" x="608" y="104" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">165</text>
    <text class="cart-text" x="502" y="118" font-size="7.5" fill="#3C3D48">1 × Brunello di Mont.</text>
    <text class="cart-text" x="608" y="118" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">185</text>

    <line x1="502" y1="130" x2="608" y2="130" stroke="#E5E7EE" stroke-width="0.5"/>

    <!-- Serving 2 -->
    <text class="cart-text" x="510" y="146" font-size="8.5" font-weight="500" fill="#1a1a2e">Serving 2</text>
    <rect x="586" y="138" width="14" height="11" rx="5.5" fill="#F0F1F5"/>
    <text class="cart-text" x="593" y="146" font-size="7" font-weight="600" fill="#6E707A" text-anchor="middle">2</text>
    <text class="cart-text" x="502" y="164" font-size="7.5" fill="#3C3D48">1 × Dover Sole Meun.</text>
    <text class="cart-text" x="608" y="164" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">395</text>
    <text class="cart-text" x="502" y="178" font-size="7.5" fill="#3C3D48">1 × Cacio e Pepe</text>
    <text class="cart-text" x="608" y="178" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">195</text>

    <!-- Total -->
    <line x1="500" y1="232" x2="610" y2="232" stroke="#E5E7EE" stroke-width="0.6"/>
    <text class="cart-text" x="608" y="252" font-size="14" font-weight="600" fill="#1a1a2e" text-anchor="end">940,00</text>
    <text class="cart-text" x="608" y="265" font-size="8" fill="#9194A0" text-anchor="end">SEK</text>

    <!-- Icon row (Discount, Guest bill) -->
    <text class="cart-text" x="513" y="284" font-size="11" font-weight="500" fill="#534AB7" text-anchor="middle">%</text>
    <text class="cart-text" x="513" y="293" font-size="6" fill="#6E707A" text-anchor="middle">Discount</text>
    <rect x="544" y="276" width="10" height="8" rx="1" fill="none" stroke="#534AB7" stroke-width="1"/>
    <line x1="546" y1="278.5" x2="552" y2="278.5" stroke="#534AB7" stroke-width="0.6"/>
    <line x1="546" y1="281" x2="552" y2="281" stroke="#534AB7" stroke-width="0.6"/>
    <text class="cart-text" x="549" y="293" font-size="6" fill="#6E707A" text-anchor="middle">Guest bill</text>

    <!-- Action buttons row: Fire S1 (filled, primary) + New serving + Pay -->
    <rect x="500" y="302" width="40" height="24" rx="4" fill="#534AB7"/>
    <text class="cart-text" x="520" y="317" font-size="7.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Fire Serving 1</text>
    <rect x="544" y="302" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.6"/>
    <text class="cart-text" x="561" y="317" font-size="7.5" font-weight="500" fill="#534AB7" text-anchor="middle">New serv.</text>
    <rect x="582" y="302" width="28" height="24" rx="4" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.6"/>
    <text class="cart-text" x="596" y="317" font-size="7.5" font-weight="500" fill="#534AB7" text-anchor="middle">Pay</text>
  </g>

  <rect x="492" y="42" width="126" height="299" rx="12" fill="none" stroke="#6A5AE0" stroke-width="1.2" stroke-dasharray="3 2.5"/>
</svg>
