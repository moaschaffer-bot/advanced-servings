<svg xmlns="http://www.w3.org/2000/svg" width="680" height="383" viewBox="0 0 680 383" role="img" aria-label="Serving priorities cart preview, dark theme">
  <title>Serving priorities cart preview (dark)</title>
  <desc>Priorities mode cart — predefined courses, no New serving button needed because the next course is fired automatically.</desc>
  <defs>
    <clipPath id="screen-clip-pr-dark">
      <rect x="60" y="40" width="560" height="303" rx="16"/>
    </clipPath>
    <style>
      .cart-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="60" y="40" width="560" height="303" rx="16" fill="#16181F"/>

  <g clip-path="url(#screen-clip-pr-dark)">
    <rect x="60" y="40" width="44" height="303" fill="#1C1E26"/>
    <circle cx="82" cy="66" r="3.5" fill="#5F6270"/>
    <rect x="68" y="102" width="28" height="28" rx="8" fill="#2E2640"/>
    <circle cx="82" cy="116" r="3.5" fill="#B9AEF5"/>
    <circle cx="82" cy="156" r="3.5" fill="#5F6270"/>
    <circle cx="82" cy="188" r="3.5" fill="#5F6270"/>
    <circle cx="82" cy="280" r="3.5" fill="#5F6270"/>
    <circle cx="82" cy="312" r="3.5" fill="#5F6270"/>

    <rect x="320" y="56" width="36" height="8" rx="2" fill="#A8ACB8"/>

    <rect x="118" y="82" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="124" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="166" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="208" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="250" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="292" width="64" height="36" rx="4" fill="#2A2D38"/>

    <g fill="#2A2D38">
      <rect x="192" y="82" width="70" height="44" rx="3"/>
      <rect x="268" y="82" width="70" height="44" rx="3"/>
      <rect x="344" y="82" width="70" height="44" rx="3"/>
      <rect x="420" y="82" width="62" height="44" rx="3"/>
      <rect x="192" y="134" width="70" height="44" rx="3"/>
      <rect x="268" y="134" width="70" height="44" rx="3"/>
      <rect x="344" y="134" width="70" height="44" rx="3"/>
      <rect x="420" y="134" width="62" height="44" rx="3"/>
      <rect x="192" y="186" width="70" height="44" rx="3"/>
      <rect x="268" y="186" width="70" height="44" rx="3"/>
      <rect x="344" y="186" width="70" height="44" rx="3"/>
      <rect x="420" y="186" width="62" height="44" rx="3"/>
      <rect x="192" y="238" width="70" height="44" rx="3"/>
      <rect x="268" y="238" width="70" height="44" rx="3"/>
      <rect x="344" y="238" width="70" height="44" rx="3"/>
      <rect x="420" y="238" width="62" height="44" rx="3"/>
      <rect x="192" y="290" width="70" height="44" rx="3"/>
      <rect x="268" y="290" width="70" height="44" rx="3"/>
      <rect x="344" y="290" width="70" height="44" rx="3"/>
      <rect x="420" y="290" width="62" height="44" rx="3"/>
    </g>

    <!-- Cart panel -->
    <rect x="490" y="40" width="130" height="303" fill="#16181F"/>

    <!-- Tabs -->
    <text class="cart-text" x="502" y="60" font-size="9" font-weight="500" fill="#FFFFFF">Cart</text>
    <text class="cart-text" x="528" y="60" font-size="7.5" fill="#A8ACB8">Articles</text>
    <line x1="500" y1="66" x2="522" y2="66" stroke="#B9AEF5" stroke-width="1.2"/>
    <line x1="490" y1="68" x2="620" y2="68" stroke="#2A2D38" stroke-width="0.5"/>

    <!-- Drinks -->
    <text class="cart-text" x="502" y="83" font-size="8.5" font-weight="500" fill="#FFFFFF">Drinks</text>
    <rect x="586" y="75" width="14" height="11" rx="5.5" fill="#2A2D38"/>
    <text class="cart-text" x="593" y="83" font-size="7" font-weight="600" fill="#A8ACB8" text-anchor="middle">2</text>
    <text class="cart-text" x="502" y="98" font-size="7.5" fill="#B0B3BD">1 × Châteauneuf-du-P.</text>
    <text class="cart-text" x="608" y="98" font-size="7.5" font-weight="500" fill="#FFFFFF" text-anchor="end">165</text>
    <text class="cart-text" x="502" y="110" font-size="7.5" fill="#B0B3BD">1 × Brunello di Mont.</text>
    <text class="cart-text" x="608" y="110" font-size="7.5" font-weight="500" fill="#FFFFFF" text-anchor="end">185</text>

    <line x1="502" y1="121" x2="608" y2="121" stroke="#2A2D38" stroke-width="0.5"/>

    <!-- Appetizer -->
    <text class="cart-text" x="502" y="134" font-size="8.5" font-weight="500" fill="#FFFFFF">Appetizer</text>
    <rect x="586" y="126" width="14" height="11" rx="5.5" fill="#2A2D38"/>
    <text class="cart-text" x="593" y="134" font-size="7" font-weight="600" fill="#A8ACB8" text-anchor="middle">2</text>
    <text class="cart-text" x="502" y="149" font-size="7.5" fill="#B0B3BD">1 × Beef Tartare</text>
    <text class="cart-text" x="608" y="149" font-size="7.5" font-weight="500" fill="#FFFFFF" text-anchor="end">185</text>
    <text class="cart-text" x="502" y="161" font-size="7.5" fill="#B0B3BD">1 × Foie Gras Terrine</text>
    <text class="cart-text" x="608" y="161" font-size="7.5" font-weight="500" fill="#FFFFFF" text-anchor="end">225</text>

    <line x1="502" y1="172" x2="608" y2="172" stroke="#2A2D38" stroke-width="0.5"/>

    <!-- Main Course -->
    <text class="cart-text" x="502" y="185" font-size="8.5" font-weight="500" fill="#FFFFFF">Main Course</text>
    <rect x="586" y="177" width="14" height="11" rx="5.5" fill="#2A2D38"/>
    <text class="cart-text" x="593" y="185" font-size="7" font-weight="600" fill="#A8ACB8" text-anchor="middle">2</text>
    <text class="cart-text" x="502" y="200" font-size="7.5" fill="#B0B3BD">1 × Wagyu Ribeye 250g</text>
    <text class="cart-text" x="608" y="200" font-size="7.5" font-weight="500" fill="#FFFFFF" text-anchor="end">595</text>
    <text class="cart-text" x="502" y="212" font-size="7.5" fill="#B0B3BD">1 × Rack of Lamb</text>
    <text class="cart-text" x="608" y="212" font-size="7.5" font-weight="500" fill="#FFFFFF" text-anchor="end">385</text>

    <line x1="502" y1="223" x2="608" y2="223" stroke="#2A2D38" stroke-width="0.5"/>

    <!-- Dessert (active) -->
    <circle cx="503" cy="233" r="2.5" fill="#B9AEF5"/>
    <text class="cart-text" x="510" y="236" font-size="8.5" font-weight="500" fill="#FFFFFF">Dessert</text>
    <rect x="586" y="228" width="14" height="11" rx="5.5" fill="#2E2640"/>
    <text class="cart-text" x="593" y="236" font-size="7" font-weight="600" fill="#B9AEF5" text-anchor="middle">2</text>

    <!-- Total -->
    <line x1="500" y1="248" x2="610" y2="248" stroke="#2A2D38" stroke-width="0.6"/>
    <text class="cart-text" x="608" y="268" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="end">2 020,00</text>
    <text class="cart-text" x="608" y="281" font-size="8" fill="#A8ACB8" text-anchor="end">SEK</text>

    <!-- Icon row -->
    <text class="cart-text" x="513" y="298" font-size="11" font-weight="500" fill="#B9AEF5" text-anchor="middle">%</text>
    <text class="cart-text" x="513" y="307" font-size="6" fill="#A8ACB8" text-anchor="middle">Discount</text>
    <rect x="544" y="290" width="10" height="8" rx="1" fill="none" stroke="#B9AEF5" stroke-width="1"/>
    <line x1="546" y1="292.5" x2="552" y2="292.5" stroke="#B9AEF5" stroke-width="0.6"/>
    <line x1="546" y1="295" x2="552" y2="295" stroke="#B9AEF5" stroke-width="0.6"/>
    <text class="cart-text" x="549" y="307" font-size="6" fill="#A8ACB8" text-anchor="middle">Guest bill</text>

    <!-- Action buttons row: Fire Drinks + Pay (no New serving) -->
    <rect x="500" y="316" width="68" height="24" rx="4" fill="#B9AEF5"/>
    <text class="cart-text" x="534" y="331" font-size="7.5" font-weight="600" fill="#1A1A2E" text-anchor="middle">Fire Drinks</text>
    <rect x="572" y="316" width="38" height="24" rx="4" fill="#16181F" stroke="#B9AEF5" stroke-width="0.6"/>
    <text class="cart-text" x="591" y="331" font-size="7.5" font-weight="500" fill="#B9AEF5" text-anchor="middle">Pay</text>
  </g>

  <rect x="492" y="42" width="126" height="299" rx="12" fill="none" stroke="#B9AEF5" stroke-width="1.2" stroke-dasharray="3 2.5"/>
</svg>
