<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="766" viewBox="0 0 720 383" role="img" aria-label="Serving priorities cart preview, dark theme">
  <title>Serving priorities cart preview (dark)</title>
  <desc>Priorities mode cart — predefined courses, no New serving button needed because the next course is fired automatically.</desc>
  <defs>
    <clipPath id="screen-clip-pr-dark">
      <rect x="60" y="40" width="600" height="303" rx="16"/>
    </clipPath>
    <style>
      .cart-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="60" y="40" width="600" height="303" rx="16" fill="#16181F"/>

  <g clip-path="url(#screen-clip-pr-dark)">
    <rect x="60" y="40" width="44" height="303" fill="#1C1E26"/>
    <circle cx="82" cy="66" r="3.5" fill="#5F6270"/>
    <rect x="68" y="102" width="28" height="28" rx="8" fill="#2E2640"/>
    <circle cx="82" cy="116" r="3.5" fill="#B9AEF5"/>
    <circle cx="82" cy="156" r="3.5" fill="#5F6270"/>
    <circle cx="82" cy="188" r="3.5" fill="#5F6270"/>
    <circle cx="82" cy="280" r="3.5" fill="#5F6270"/>
    <circle cx="82" cy="312" r="3.5" fill="#5F6270"/>

    <rect x="320" y="56" width="36" height="8" rx="2" fill="#A8ACB8"/>

    <rect x="118" y="82" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="124" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="166" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="208" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="250" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="292" width="64" height="36" rx="4" fill="#2A2D38"/>

    <g fill="#2A2D38">
      <rect x="192" y="82" width="68" height="44" rx="3"/>
      <rect x="266" y="82" width="68" height="44" rx="3"/>
      <rect x="340" y="82" width="68" height="44" rx="3"/>
      <rect x="414" y="82" width="68" height="44" rx="3"/>
      <rect x="192" y="134" width="68" height="44" rx="3"/>
      <rect x="266" y="134" width="68" height="44" rx="3"/>
      <rect x="340" y="134" width="68" height="44" rx="3"/>
      <rect x="414" y="134" width="68" height="44" rx="3"/>
      <rect x="192" y="186" width="68" height="44" rx="3"/>
      <rect x="266" y="186" width="68" height="44" rx="3"/>
      <rect x="340" y="186" width="68" height="44" rx="3"/>
      <rect x="414" y="186" width="68" height="44" rx="3"/>
      <rect x="192" y="238" width="68" height="44" rx="3"/>
      <rect x="266" y="238" width="68" height="44" rx="3"/>
      <rect x="340" y="238" width="68" height="44" rx="3"/>
      <rect x="414" y="238" width="68" height="44" rx="3"/>
      <rect x="192" y="290" width="68" height="44" rx="3"/>
      <rect x="266" y="290" width="68" height="44" rx="3"/>
      <rect x="340" y="290" width="68" height="44" rx="3"/>
      <rect x="414" y="290" width="68" height="44" rx="3"/>
    </g>

    <!-- Cart panel -->
    <rect x="490" y="40" width="170" height="303" fill="#16181F"/>

    <!-- Tabs -->
    <text class="cart-text" x="504" y="60" font-size="9.5" font-weight="500" fill="#FFFFFF">Cart</text>
    <line x1="502" y1="65" x2="528" y2="65" stroke="#B9AEF5" stroke-width="1.4"/>
    <line x1="490" y1="68" x2="660" y2="68" stroke="#2A2D38" stroke-width="0.5"/>

    <!-- Drinks -->
    <text class="cart-text" x="504" y="82" font-size="9" font-weight="500" fill="#FFFFFF">Drinks</text>
    <rect x="632" y="74" width="14" height="12" rx="6" fill="#2A2D38"/>
    <text class="cart-text" x="639" y="83" font-size="7.5" font-weight="600" fill="#A8ACB8" text-anchor="middle">2</text>
    <text class="cart-text" x="504" y="96" font-size="8" fill="#B0B3BD">1 × Châteauneuf-du-Pape</text>
    <text class="cart-text" x="646" y="96" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">165</text>
    <text class="cart-text" x="504" y="107" font-size="8" fill="#B0B3BD">1 × Brunello di Montalcino</text>
    <text class="cart-text" x="646" y="107" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">185</text>

    <line x1="504" y1="115" x2="646" y2="115" stroke="#2A2D38" stroke-width="0.5"/>

    <!-- Appetizer -->
    <text class="cart-text" x="504" y="127" font-size="9" font-weight="500" fill="#FFFFFF">Appetizer</text>
    <rect x="632" y="119" width="14" height="12" rx="6" fill="#2A2D38"/>
    <text class="cart-text" x="639" y="128" font-size="7.5" font-weight="600" fill="#A8ACB8" text-anchor="middle">2</text>
    <text class="cart-text" x="504" y="141" font-size="8" fill="#B0B3BD">1 × Beef Tartare</text>
    <text class="cart-text" x="646" y="141" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">185</text>
    <text class="cart-text" x="504" y="152" font-size="8" fill="#B0B3BD">1 × Foie Gras Terrine</text>
    <text class="cart-text" x="646" y="152" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">225</text>

    <line x1="504" y1="160" x2="646" y2="160" stroke="#2A2D38" stroke-width="0.5"/>

    <!-- Main Course -->
    <text class="cart-text" x="504" y="172" font-size="9" font-weight="500" fill="#FFFFFF">Main Course</text>
    <rect x="632" y="164" width="14" height="12" rx="6" fill="#2A2D38"/>
    <text class="cart-text" x="639" y="173" font-size="7.5" font-weight="600" fill="#A8ACB8" text-anchor="middle">2</text>
    <text class="cart-text" x="504" y="186" font-size="8" fill="#B0B3BD">1 × Wagyu Ribeye 250g</text>
    <text class="cart-text" x="646" y="186" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">595</text>
    <text class="cart-text" x="504" y="197" font-size="8" fill="#B0B3BD">1 × Rack of Lamb</text>
    <text class="cart-text" x="646" y="197" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">385</text>

    <line x1="504" y1="205" x2="646" y2="205" stroke="#2A2D38" stroke-width="0.5"/>

    <!-- Dessert (active) -->
    <circle cx="507" cy="215" r="3" fill="#B9AEF5"/>
    <text class="cart-text" x="516" y="217" font-size="9" font-weight="500" fill="#FFFFFF">Dessert</text>
    <rect x="632" y="209" width="14" height="12" rx="6" fill="#2E2640"/>
    <text class="cart-text" x="639" y="218" font-size="7.5" font-weight="600" fill="#B9AEF5" text-anchor="middle">2</text>
    <text class="cart-text" x="504" y="231" font-size="8" fill="#B0B3BD">1 × Crème Brûlée</text>
    <text class="cart-text" x="646" y="231" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">125</text>
    <text class="cart-text" x="504" y="242" font-size="8" fill="#B0B3BD">1 × Chocolate Soufflé</text>
    <text class="cart-text" x="646" y="242" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">155</text>

    <!-- Total -->
    <line x1="502" y1="252" x2="648" y2="252" stroke="#2A2D38" stroke-width="0.6"/>
    <text class="cart-text" x="646" y="269" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="end">2 020,00</text>
    <text class="cart-text" x="646" y="280" font-size="8.5" font-weight="500" fill="#A8ACB8" text-anchor="end">SEK</text>

    <!-- Action buttons row: 2 equal-width buttons -->
    <rect x="504" y="289" width="69" height="40" rx="6" fill="#B9AEF5"/>
    <text class="cart-text" x="538" y="313" font-size="9.5" font-weight="600" fill="#1A1A2E" text-anchor="middle">Fire Drinks</text>
    <rect x="577" y="289" width="69" height="40" rx="6" fill="#16181F" stroke="#B9AEF5" stroke-width="0.8"/>
    <text class="cart-text" x="611" y="313" font-size="9.5" font-weight="500" fill="#B9AEF5" text-anchor="middle">Pay</text>
  </g>

  <rect x="492" y="42" width="166" height="299" rx="12" fill="none" stroke="#B9AEF5" stroke-width="1.2" stroke-dasharray="3 2.5"/>
</svg>
