<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="766" viewBox="0 0 720 383" role="img" aria-label="Serving priorities cart preview, light theme">
  <title>Serving priorities cart preview (light)</title>
  <desc>Priorities mode cart — predefined courses, no New serving button needed because the next course is fired automatically.</desc>
  <defs>
    <clipPath id="screen-clip-pr-light">
      <rect x="60" y="40" width="600" height="303" rx="16"/>
    </clipPath>
    <style>
      .cart-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="60" y="40" width="600" height="303" rx="16" fill="#E5E8EE" stroke="#C5C7CE" stroke-width="0.6"/>

  <g clip-path="url(#screen-clip-pr-light)">
    <rect x="60" y="40" width="44" height="303" fill="#FFFFFF"/>
    <circle cx="82" cy="66" r="3.5" fill="#C5C7CE"/>
    <rect x="68" y="102" width="28" height="28" rx="8" fill="#EAE6FF"/>
    <circle cx="82" cy="116" r="3.5" fill="#6A5AE0"/>
    <circle cx="82" cy="156" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="188" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="280" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="312" r="3.5" fill="#C5C7CE"/>

    <rect x="320" y="56" width="36" height="8" rx="2" fill="#9194A0"/>

    <rect x="118" y="82" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="124" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="166" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="208" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="250" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="292" width="64" height="36" rx="4" fill="#FFFFFF"/>

    <g fill="#FFFFFF">
      <rect x="192" y="82" width="68" height="44" rx="3"/>
      <rect x="266" y="82" width="68" height="44" rx="3"/>
      <rect x="340" y="82" width="68" height="44" rx="3"/>
      <rect x="414" y="82" width="68" height="44" rx="3"/>
      <rect x="192" y="134" width="68" height="44" rx="3"/>
      <rect x="266" y="134" width="68" height="44" rx="3"/>
      <rect x="340" y="134" width="68" height="44" rx="3"/>
      <rect x="414" y="134" width="68" height="44" rx="3"/>
      <rect x="192" y="186" width="68" height="44" rx="3"/>
      <rect x="266" y="186" width="68" height="44" rx="3"/>
      <rect x="340" y="186" width="68" height="44" rx="3"/>
      <rect x="414" y="186" width="68" height="44" rx="3"/>
      <rect x="192" y="238" width="68" height="44" rx="3"/>
      <rect x="266" y="238" width="68" height="44" rx="3"/>
      <rect x="340" y="238" width="68" height="44" rx="3"/>
      <rect x="414" y="238" width="68" height="44" rx="3"/>
      <rect x="192" y="290" width="68" height="44" rx="3"/>
      <rect x="266" y="290" width="68" height="44" rx="3"/>
      <rect x="340" y="290" width="68" height="44" rx="3"/>
      <rect x="414" y="290" width="68" height="44" rx="3"/>
    </g>

    <!-- Cart panel -->
    <rect x="490" y="40" width="170" height="303" fill="#FFFFFF"/>

    <!-- Tabs -->
    <text class="cart-text" x="504" y="60" font-size="9.5" font-weight="500" fill="#1a1a2e">Cart</text>
    <text class="cart-text" x="535" y="60" font-size="7.5" fill="#9194A0">Articles summary</text>
    <line x1="502" y1="65" x2="528" y2="65" stroke="#534AB7" stroke-width="1.4"/>
    <line x1="490" y1="68" x2="660" y2="68" stroke="#E5E7EE" stroke-width="0.5"/>

    <!-- Drinks -->
    <text class="cart-text" x="504" y="84" font-size="9" font-weight="500" fill="#1a1a2e">Drinks</text>
    <rect x="638" y="76" width="14" height="12" rx="6" fill="#F0F1F5"/>
    <text class="cart-text" x="645" y="85" font-size="7.5" font-weight="600" fill="#6E707A" text-anchor="middle">2</text>
    <text class="cart-text" x="504" y="98" font-size="8" fill="#3C3D48">1 × Châteauneuf-du-Pape</text>
    <text class="cart-text" x="652" y="98" font-size="8" font-weight="500" fill="#1a1a2e" text-anchor="end">165</text>
    <text class="cart-text" x="504" y="110" font-size="8" fill="#3C3D48">1 × Brunello di Montalcino</text>
    <text class="cart-text" x="652" y="110" font-size="8" font-weight="500" fill="#1a1a2e" text-anchor="end">185</text>

    <line x1="504" y1="118" x2="652" y2="118" stroke="#E5E7EE" stroke-width="0.5"/>

    <!-- Appetizer -->
    <text class="cart-text" x="504" y="130" font-size="9" font-weight="500" fill="#1a1a2e">Appetizer</text>
    <rect x="638" y="122" width="14" height="12" rx="6" fill="#F0F1F5"/>
    <text class="cart-text" x="645" y="131" font-size="7.5" font-weight="600" fill="#6E707A" text-anchor="middle">2</text>
    <text class="cart-text" x="504" y="144" font-size="8" fill="#3C3D48">1 × Beef Tartare</text>
    <text class="cart-text" x="652" y="144" font-size="8" font-weight="500" fill="#1a1a2e" text-anchor="end">185</text>
    <text class="cart-text" x="504" y="156" font-size="8" fill="#3C3D48">1 × Foie Gras Terrine</text>
    <text class="cart-text" x="652" y="156" font-size="8" font-weight="500" fill="#1a1a2e" text-anchor="end">225</text>

    <line x1="504" y1="164" x2="652" y2="164" stroke="#E5E7EE" stroke-width="0.5"/>

    <!-- Main Course -->
    <text class="cart-text" x="504" y="176" font-size="9" font-weight="500" fill="#1a1a2e">Main Course</text>
    <rect x="638" y="168" width="14" height="12" rx="6" fill="#F0F1F5"/>
    <text class="cart-text" x="645" y="177" font-size="7.5" font-weight="600" fill="#6E707A" text-anchor="middle">2</text>
    <text class="cart-text" x="504" y="190" font-size="8" fill="#3C3D48">1 × Wagyu Ribeye 250g</text>
    <text class="cart-text" x="652" y="190" font-size="8" font-weight="500" fill="#1a1a2e" text-anchor="end">595</text>
    <text class="cart-text" x="504" y="202" font-size="8" fill="#3C3D48">1 × Rack of Lamb</text>
    <text class="cart-text" x="652" y="202" font-size="8" font-weight="500" fill="#1a1a2e" text-anchor="end">385</text>

    <line x1="504" y1="210" x2="652" y2="210" stroke="#E5E7EE" stroke-width="0.5"/>

    <!-- Dessert (active) -->
    <circle cx="507" cy="220" r="3" fill="#534AB7"/>
    <text class="cart-text" x="516" y="222" font-size="9" font-weight="500" fill="#1a1a2e">Dessert</text>
    <rect x="638" y="214" width="14" height="12" rx="6" fill="#EAE6FF"/>
    <text class="cart-text" x="645" y="223" font-size="7.5" font-weight="600" fill="#3C3489" text-anchor="middle">2</text>
    <text class="cart-text" x="504" y="236" font-size="8" fill="#3C3D48">1 × Crème Brûlée</text>
    <text class="cart-text" x="652" y="236" font-size="8" font-weight="500" fill="#1a1a2e" text-anchor="end">125</text>
    <text class="cart-text" x="504" y="248" font-size="8" fill="#3C3D48">1 × Chocolate Soufflé</text>
    <text class="cart-text" x="652" y="248" font-size="8" font-weight="500" fill="#1a1a2e" text-anchor="end">155</text>

    <!-- Total -->
    <line x1="502" y1="258" x2="654" y2="258" stroke="#E5E7EE" stroke-width="0.6"/>
    <text class="cart-text" x="652" y="277" font-size="14" font-weight="700" fill="#1a1a2e" text-anchor="end">2 020,00</text>
    <text class="cart-text" x="652" y="289" font-size="8.5" font-weight="500" fill="#9194A0" text-anchor="end">SEK</text>

    <!-- Icon row -->
    <text class="cart-text" x="520" y="304" font-size="12" font-weight="500" fill="#534AB7" text-anchor="middle">%</text>
    <text class="cart-text" x="520" y="313" font-size="6.5" fill="#6E707A" text-anchor="middle">Discount</text>
    <rect x="554" y="294" width="12" height="9" rx="1.5" fill="none" stroke="#534AB7" stroke-width="1"/>
    <line x1="557" y1="297" x2="563" y2="297" stroke="#534AB7" stroke-width="0.6"/>
    <line x1="557" y1="299.5" x2="563" y2="299.5" stroke="#534AB7" stroke-width="0.6"/>
    <text class="cart-text" x="560" y="313" font-size="6.5" fill="#6E707A" text-anchor="middle">Guest bill</text>

    <!-- Action buttons row: Fire Drinks (filled, wide) + Pay -->
    <rect x="502" y="320" width="100" height="20" rx="5" fill="#534AB7"/>
    <text class="cart-text" x="552" y="334" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Fire Drinks</text>
    <rect x="606" y="320" width="48" height="20" rx="5" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.7"/>
    <text class="cart-text" x="630" y="334" font-size="8.5" font-weight="500" fill="#534AB7" text-anchor="middle">Pay</text>
  </g>

  <rect x="492" y="42" width="166" height="299" rx="12" fill="none" stroke="#6A5AE0" stroke-width="1.2" stroke-dasharray="3 2.5"/>
</svg>
