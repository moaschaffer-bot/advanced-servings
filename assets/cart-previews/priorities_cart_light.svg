<svg xmlns="http://www.w3.org/2000/svg" width="680" height="383" viewBox="0 0 680 383" role="img" aria-label="Serving priorities cart preview, light theme">
  <title>Serving priorities cart preview (light)</title>
  <desc>Cart with predefined courses — Drinks (open) on top, then Appetizer, Main Course, Dessert.</desc>
  <defs>
    <clipPath id="screen-clip-pr-light">
      <rect x="60" y="40" width="560" height="303" rx="16"/>
    </clipPath>
    <style>
      .cart-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="60" y="40" width="560" height="303" rx="16" fill="#E5E8EE" stroke="#C5C7CE" stroke-width="0.6"/>

  <g clip-path="url(#screen-clip-pr-light)">
    <rect x="60" y="40" width="44" height="303" fill="#FFFFFF"/>
    <circle cx="82" cy="66" r="3.5" fill="#C5C7CE"/>
    <rect x="68" y="102" width="28" height="28" rx="8" fill="#EAE6FF"/>
    <circle cx="82" cy="116" r="3.5" fill="#6A5AE0"/>
    <circle cx="82" cy="156" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="188" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="280" r="3.5" fill="#C5C7CE"/>
    <circle cx="82" cy="312" r="3.5" fill="#C5C7CE"/>

    <rect x="320" y="56" width="36" height="8" rx="2" fill="#9194A0"/>

    <rect x="118" y="82" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="124" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="166" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="208" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="250" width="64" height="36" rx="4" fill="#FFFFFF"/>
    <rect x="118" y="292" width="64" height="36" rx="4" fill="#FFFFFF"/>

    <g fill="#FFFFFF">
      <rect x="192" y="82" width="70" height="44" rx="3"/>
      <rect x="268" y="82" width="70" height="44" rx="3"/>
      <rect x="344" y="82" width="70" height="44" rx="3"/>
      <rect x="420" y="82" width="62" height="44" rx="3"/>
      <rect x="192" y="134" width="70" height="44" rx="3"/>
      <rect x="268" y="134" width="70" height="44" rx="3"/>
      <rect x="344" y="134" width="70" height="44" rx="3"/>
      <rect x="420" y="134" width="62" height="44" rx="3"/>
      <rect x="192" y="186" width="70" height="44" rx="3"/>
      <rect x="268" y="186" width="70" height="44" rx="3"/>
      <rect x="344" y="186" width="70" height="44" rx="3"/>
      <rect x="420" y="186" width="62" height="44" rx="3"/>
      <rect x="192" y="238" width="70" height="44" rx="3"/>
      <rect x="268" y="238" width="70" height="44" rx="3"/>
      <rect x="344" y="238" width="70" height="44" rx="3"/>
      <rect x="420" y="238" width="62" height="44" rx="3"/>
      <rect x="192" y="290" width="70" height="44" rx="3"/>
      <rect x="268" y="290" width="70" height="44" rx="3"/>
      <rect x="344" y="290" width="70" height="44" rx="3"/>
      <rect x="420" y="290" width="62" height="44" rx="3"/>
    </g>

    <!-- Cart panel -->
    <rect x="490" y="40" width="130" height="303" fill="#FFFFFF"/>
    <text class="cart-text" x="502" y="62" font-size="10" font-weight="500" fill="#1a1a2e">Cart</text>

    <!-- Drinks (open, amber) -->
    <rect x="500" y="70" width="110" height="13" rx="3" fill="#FAEEDA"/>
    <circle cx="506" cy="76.5" r="2" fill="#B07410"/>
    <text class="cart-text" x="512" y="79" font-size="8" font-weight="500" fill="#8A5A18">Drinks</text>
    <text class="cart-text" x="606" y="79" font-size="7" fill="#A8782A" text-anchor="end">Fired</text>
    <text class="cart-text" x="502" y="94" font-size="7.5" fill="#444">Amarone V.</text>
    <text class="cart-text" x="608" y="94" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">225</text>
    <text class="cart-text" x="502" y="105" font-size="7.5" fill="#444">Barolo Riserva</text>
    <text class="cart-text" x="608" y="105" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">195</text>

    <!-- Appetizer (course, lavender) -->
    <rect x="500" y="116" width="110" height="13" rx="3" fill="#EAE6FF"/>
    <text class="cart-text" x="506" y="125" font-size="8" font-weight="500" fill="#3C3489">Appetizer</text>
    <text class="cart-text" x="606" y="125" font-size="7" fill="#5A4FB8" text-anchor="end">Fired</text>
    <text class="cart-text" x="502" y="140" font-size="7.5" fill="#444">Beef Tartare</text>
    <text class="cart-text" x="608" y="140" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">185</text>
    <text class="cart-text" x="502" y="151" font-size="7.5" fill="#444">Foie Gras</text>
    <text class="cart-text" x="608" y="151" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">225</text>

    <!-- Main Course (course, lavender) -->
    <rect x="500" y="162" width="110" height="13" rx="3" fill="#EAE6FF"/>
    <text class="cart-text" x="506" y="171" font-size="8" font-weight="500" fill="#3C3489">Main Course</text>
    <text class="cart-text" x="606" y="171" font-size="7" fill="#5A4FB8" text-anchor="end">Waiting</text>
    <text class="cart-text" x="502" y="186" font-size="7.5" fill="#444">Dover Sole</text>
    <text class="cart-text" x="608" y="186" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">395</text>
    <text class="cart-text" x="502" y="197" font-size="7.5" fill="#444">Lobster Therm.</text>
    <text class="cart-text" x="608" y="197" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">495</text>

    <!-- Dessert (course, lavender) -->
    <rect x="500" y="208" width="110" height="13" rx="3" fill="#EAE6FF"/>
    <text class="cart-text" x="506" y="217" font-size="8" font-weight="500" fill="#3C3489">Dessert</text>
    <text class="cart-text" x="606" y="217" font-size="7" fill="#5A4FB8" text-anchor="end">Waiting</text>
    <text class="cart-text" x="502" y="232" font-size="7.5" fill="#444">Crème Brûlée</text>
    <text class="cart-text" x="608" y="232" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">125</text>
    <text class="cart-text" x="502" y="243" font-size="7.5" fill="#444">Choc. Soufflé</text>
    <text class="cart-text" x="608" y="243" font-size="7.5" font-weight="500" fill="#1a1a2e" text-anchor="end">155</text>

    <!-- Total -->
    <line x1="500" y1="256" x2="610" y2="256" stroke="#E5E7EE" stroke-width="0.6"/>
    <text class="cart-text" x="502" y="268" font-size="9" font-weight="500" fill="#1a1a2e">Total</text>
    <text class="cart-text" x="608" y="268" font-size="9" font-weight="600" fill="#1a1a2e" text-anchor="end">2 000 kr</text>

    <!-- Action buttons -->
    <rect x="500" y="288" width="38" height="38" rx="4" fill="#EEEDFE"/>
    <text class="cart-text" x="519" y="311" font-size="7" font-weight="500" fill="#3C3489" text-anchor="middle">Discount</text>
    <rect x="542" y="288" width="38" height="38" rx="4" fill="#EEEDFE"/>
    <text class="cart-text" x="561" y="311" font-size="7" font-weight="500" fill="#3C3489" text-anchor="middle">Guest bill</text>
    <rect x="584" y="288" width="36" height="38" rx="4" fill="#534AB7"/>
    <text class="cart-text" x="602" y="311" font-size="7.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Fire Drinks</text>
  </g>

  <rect x="492" y="42" width="126" height="299" rx="12" fill="none" stroke="#6A5AE0" stroke-width="1.2" stroke-dasharray="3 2.5"/>
</svg>
