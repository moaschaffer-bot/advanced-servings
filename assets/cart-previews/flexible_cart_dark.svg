<svg xmlns="http://www.w3.org/2000/svg" width="680" height="383" viewBox="0 0 680 383" role="img" aria-label="Flexible servings cart preview, dark theme">
  <title>Flexible servings cart preview (dark)</title>
  <desc>Cart with three flexible servings — staff name and order them at the POS.</desc>
  <defs>
    <clipPath id="screen-clip-fl-dark">
      <rect x="60" y="40" width="560" height="303" rx="16"/>
    </clipPath>
    <style>
      .cart-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="60" y="40" width="560" height="303" rx="16" fill="#16181F"/>

  <g clip-path="url(#screen-clip-fl-dark)">
    <!-- Sidebar -->
    <rect x="60" y="40" width="44" height="303" fill="#1C1E26"/>
    <circle cx="82" cy="66" r="3.5" fill="#5F6270"/>
    <rect x="68" y="102" width="28" height="28" rx="8" fill="#2E2640"/>
    <circle cx="82" cy="116" r="3.5" fill="#B9AEF5"/>
    <circle cx="82" cy="156" r="3.5" fill="#5F6270"/>
    <circle cx="82" cy="188" r="3.5" fill="#5F6270"/>
    <circle cx="82" cy="280" r="3.5" fill="#5F6270"/>
    <circle cx="82" cy="312" r="3.5" fill="#5F6270"/>

    <rect x="320" y="56" width="36" height="8" rx="2" fill="#A8ACB8"/>

    <rect x="118" y="82" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="124" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="166" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="208" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="250" width="64" height="36" rx="4" fill="#2A2D38"/>
    <rect x="118" y="292" width="64" height="36" rx="4" fill="#2A2D38"/>

    <g fill="#2A2D38">
      <rect x="192" y="82" width="70" height="44" rx="3"/>
      <rect x="268" y="82" width="70" height="44" rx="3"/>
      <rect x="344" y="82" width="70" height="44" rx="3"/>
      <rect x="420" y="82" width="62" height="44" rx="3"/>
      <rect x="192" y="134" width="70" height="44" rx="3"/>
      <rect x="268" y="134" width="70" height="44" rx="3"/>
      <rect x="344" y="134" width="70" height="44" rx="3"/>
      <rect x="420" y="134" width="62" height="44" rx="3"/>
      <rect x="192" y="186" width="70" height="44" rx="3"/>
      <rect x="268" y="186" width="70" height="44" rx="3"/>
      <rect x="344" y="186" width="70" height="44" rx="3"/>
      <rect x="420" y="186" width="62" height="44" rx="3"/>
      <rect x="192" y="238" width="70" height="44" rx="3"/>
      <rect x="268" y="238" width="70" height="44" rx="3"/>
      <rect x="344" y="238" width="70" height="44" rx="3"/>
      <rect x="420" y="238" width="62" height="44" rx="3"/>
      <rect x="192" y="290" width="70" height="44" rx="3"/>
      <rect x="268" y="290" width="70" height="44" rx="3"/>
      <rect x="344" y="290" width="70" height="44" rx="3"/>
      <rect x="420" y="290" width="62" height="44" rx="3"/>
    </g>

    <!-- Cart panel -->
    <rect x="490" y="40" width="130" height="303" fill="#16181F"/>
    <text class="cart-text" x="502" y="64" font-size="10" font-weight="500" fill="#FFFFFF">Cart</text>

    <!-- Serving 1 -->
    <rect x="500" y="74" width="110" height="13" rx="3" fill="#2A2D38"/>
    <text class="cart-text" x="506" y="83" font-size="8" font-weight="500" fill="#DDE1EA">Serving 1</text>
    <text class="cart-text" x="606" y="83" font-size="7" fill="#8C8F99" text-anchor="end">Fired 5m</text>
    <text class="cart-text" x="502" y="100" font-size="8" fill="#B0B3BD">Pripps Blå</text>
    <text class="cart-text" x="608" y="100" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">64</text>
    <text class="cart-text" x="502" y="112" font-size="8" fill="#B0B3BD">Miller</text>
    <text class="cart-text" x="608" y="112" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">58</text>

    <!-- Serving 2 -->
    <rect x="500" y="122" width="110" height="13" rx="3" fill="#2A2D38"/>
    <text class="cart-text" x="506" y="131" font-size="8" font-weight="500" fill="#DDE1EA">Serving 2</text>
    <text class="cart-text" x="606" y="131" font-size="7" fill="#8C8F99" text-anchor="end">Fired 25m</text>
    <text class="cart-text" x="502" y="148" font-size="8" fill="#B0B3BD">Capricciosa</text>
    <text class="cart-text" x="608" y="148" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">115</text>
    <text class="cart-text" x="502" y="160" font-size="8" fill="#B0B3BD">Margherita</text>
    <text class="cart-text" x="608" y="160" font-size="8" font-weight="500" fill="#FFFFFF" text-anchor="end">115</text>

    <!-- Serving 3 -->
    <rect x="500" y="170" width="110" height="13" rx="3" fill="#2A2D38"/>
    <text class="cart-text" x="506" y="179" font-size="8" font-weight="500" fill="#DDE1EA">Serving 3</text>
    <text class="cart-text" x="606" y="179" font-size="7" fill="#8C8F99" text-anchor="end">Waiting</text>
    <text class="cart-text" x="502" y="196" font-size="8" font-style="italic" fill="#5F6270">Empty — add items</text>

    <!-- Total -->
    <line x1="500" y1="222" x2="610" y2="222" stroke="#2A2D38" stroke-width="0.6"/>
    <text class="cart-text" x="502" y="234" font-size="9" font-weight="500" fill="#FFFFFF">Total</text>
    <text class="cart-text" x="608" y="234" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="end">352 kr</text>

    <!-- Action buttons -->
    <rect x="500" y="268" width="38" height="58" rx="4" fill="#2A2D38"/>
    <text class="cart-text" x="519" y="296" font-size="7" font-weight="500" fill="#B9AEF5" text-anchor="middle">Discount</text>
    <rect x="542" y="268" width="38" height="58" rx="4" fill="#2A2D38"/>
    <text class="cart-text" x="561" y="296" font-size="7" font-weight="500" fill="#B9AEF5" text-anchor="middle">Guest bill</text>
    <rect x="584" y="268" width="36" height="58" rx="4" fill="#B9AEF5"/>
    <text class="cart-text" x="602" y="296" font-size="8" font-weight="600" fill="#1A1A2E" text-anchor="middle">Fire 3</text>
  </g>

  <rect x="492" y="42" width="126" height="299" rx="12" fill="none" stroke="#B9AEF5" stroke-width="1.2" stroke-dasharray="3 2.5"/>
</svg>
